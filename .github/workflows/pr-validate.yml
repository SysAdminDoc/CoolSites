name: PR Validation
on:
  pull_request:
    paths: ['index.html']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate URLs
        run: |
          urls=$(grep -oP "url:\s*['\"]([^'\"]+)['\"]" index.html | sed "s/url:\s*['\"]//;s/['\"]$//" | sort)
          dupes=$(echo "$urls" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate URLs found:"
            echo "$dupes"
            exit 1
          fi
          echo "No duplicates found among $(echo "$urls" | wc -l) entries"

      - name: Validate new URLs
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          new_urls=$(diff <(git show origin/${{ github.base_ref }}:index.html | grep -oP "url:\s*['\"]([^'\"]+)['\"]" | sort) <(grep -oP "url:\s*['\"]([^'\"]+)['\"]" index.html | sort) | grep '^>' | sed "s/^> url:\s*['\"]//;s/['\"]$//" || true)
          if [ -z "$new_urls" ]; then
            echo "No new URLs detected"
            exit 0
          fi
          echo "New URLs to validate:"
          echo "$new_urls"
          echo "$new_urls" | xargs -I{} curl -sSf -o /dev/null -w "%{url_effective} → %{http_code}\n" --max-time 10 '{}' || {
            echo "::error::One or more new URLs failed validation"
            exit 1
          }
