name: Link Check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkCheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --cache
            --max-cache-age 7d
            --max-concurrency 10
            --accept 200,206,429
            --exclude-mail
            --github-token ${{ secrets.GITHUB_TOKEN }}
            index.html
          fail: false
          format: markdown
          output: lychee-report.md
          jobSummary: true

      - name: Create Issue From Report
        if: hashFiles('lychee-report.md') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly Link Check Report"
          content-filepath: lychee-report.md
          labels: maintenance, dead-links
