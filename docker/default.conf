server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # First matching regex wins, so this has to precede the type blocks or a
    # dotfile ending .json would slip past it.
    location ~ /\. {
        deny all;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Data files change with every curation pass, so revalidate them.
    location ~* \.(json|atom)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts are versioned by filename and never edited in place.
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The worker must be re-fetched or clients stay pinned to an old cache name.
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

}
