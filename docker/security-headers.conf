# Included from every location block. nginx's add_header does not inherit into a
# child block that sets any header of its own, so these have to be repeated
# rather than declared once at the server level.

# The directory is entirely self-hosted. Fonts, favicons and data all ship with
# the site, so nothing but 'self' and inline data URIs is needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
