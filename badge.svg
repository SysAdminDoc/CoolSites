<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" role="img" aria-label="listed on CoolSites">
  <title>listed on CoolSites</title>
  <linearGradient id="cs-sheen" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="cs-round"><rect width="128" height="20" rx="3"/></clipPath>
  <g clip-path="url(#cs-round)">
    <rect width="62" height="20" fill="#08090d"/>
    <rect x="62" width="66" height="20" fill="#6e56cf"/>
    <rect width="128" height="20" fill="url(#cs-sheen)"/>
  </g>
  <!-- Verdana with a real fallback stack, and no embedded or linked font. This
       is meant to be hotlinked onto somebody else's page, where every request it
       makes is one their reader pays for, so it makes none. -->
  <g font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11" text-anchor="middle">
    <text x="31" y="15" fill="#010101" fill-opacity=".3">listed on</text>
    <text x="31" y="14" fill="#ffffff">listed on</text>
    <text x="95" y="15" fill="#010101" fill-opacity=".3">CoolSites</text>
    <text x="95" y="14" fill="#ffffff">CoolSites</text>
  </g>
</svg>
