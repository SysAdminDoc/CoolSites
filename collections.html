    <h1>Curated Starting Points</h1>
    <p class="lede">Focused sub-lists for common workflows, built from the same validated CoolSites data.</p>
  </header>
  <section class="featured" id="collections" aria-live="polite" aria-busy="true">
    <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>
  <h2 class="more-heading" id="moreHeading">More collections</h2>
  <section class="more-collections" id="moreCollections" aria-labelledby="moreHeading"></section>
  <noscript>
    <p class="lede">Collections are built in the browser from <code>collections.json</code> and <code>sites.json</code>. Turn JavaScript on to see them, or read those two files directly.</p>
  </noscript>
</main>
<footer>
  <p><a href="./">Back to the directory</a> &middot; <a href="feeds/recent.atom">Feed</a> &middot; <a href="https://github.com/SysAdminDoc/CoolSites" target="_blank" rel="noopener noreferrer">GitHub</a></p>
</footer>
<script>
const $featured = document.getElementById('collections');
const $moreCollections = document.getElementById('moreCollections');
const $collectionNav = document.getElementById('collectionNav');
const $collectionSearch = document.getElementById('collectionSearch');
const THEME_COLORS = {oled:'#080b12',catppuccin:'#1e1e2e',nord:'#2e3440',dracula:'#282a36','github-dark':'#0d1117',midnight:'#0a0e1a',solarized:'#002b36',light:'#f8f9fc','rose-pine':'#191724'};
const THEMES = ['oled','catppuccin','dracula','rose-pine','nord','github-dark','midnight','solarized','light'];
const COLLECTION_ACCENTS = ['#168fff','#ff5a67','#6ce7c2','#a269ff','#c6dc4b'];

function syncThemeColor() {
  const theme = document.documentElement.getAttribute('data-theme') || 'oled';
  document.getElementById('metaThemeColor').setAttribute('content', THEME_COLORS[theme] || '#08090d');
}
syncThemeColor();

function updateThemeButton() {
  const theme = document.documentElement.getAttribute('data-theme') || 'oled';
  const label = `Change theme. Current theme: ${theme.replace(/-/g, ' ')}`;
  document.getElementById('collectionThemeToggle').setAttribute('aria-label', label);
  document.getElementById('collectionThemeToggle').title = label;
}
updateThemeButton();

document.getElementById('collectionThemeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'oled';
  const next = THEMES[(Math.max(0, THEMES.indexOf(current)) + 1) % THEMES.length];
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('coolsites-theme', next); } catch {}
  syncThemeColor();
  updateThemeButton();
});

// Follow the system setting when the directory has no explicit theme saved.
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', event => {
  let saved = null;
  try { saved = localStorage.getItem('coolsites-theme'); } catch {}
  if (saved && saved !== 'system') return;
  document.documentElement.setAttribute('data-theme', event.matches ? 'light' : 'oled');
  syncThemeColor();
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function domainFor(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}

function loadJson(url) {
  return fetch(url, { cache: 'no-cache' }).then(response => {
    if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
    return response.json();
  });
}

let loading = false;
let collections = [];
let sites = [];
let sitesByUrl = new Map();
let favicons = {};
let selectedCollection = 0;

function entriesFor(collection) {
  return (collection?.urls || []).map(url => sitesByUrl.get(url)).filter(Boolean);
}

function paintAccents(root) {
  for (const element of root.querySelectorAll('[data-accent]')) {
    element.style.setProperty('--collection-accent', element.dataset.accent);
  }
}

function collectionAccent(index) {
  return COLLECTION_ACCENTS[index % COLLECTION_ACCENTS.length];
}

function siteIcon(site) {
  const icon = favicons[domainFor(site.url)] || '';
  const initial = esc(site.name.charAt(0).toUpperCase());
  if (!icon) return `<span class="site-icon" aria-hidden="true">${initial}</span>`;
  return `<span class="site-icon" aria-hidden="true"><img class="collection-favicon" src="${esc(icon)}" alt=""><span>${initial}</span></span>`;
}

document.addEventListener('error', event => {
  if (!event.target.classList?.contains('collection-favicon')) return;
  event.target.remove();
}, true);

function renderNavigation(query = '') {
  const needle = query.trim().toLowerCase();
  const matches = collections
    .map((collection, index) => ({ collection, index, entries: entriesFor(collection) }))
    .filter(item => !needle || `${item.collection.name} ${item.collection.description}`.toLowerCase().includes(needle));
  if (!matches.length) {
    $collectionNav.innerHTML = '<p class="collection-nav-empty">No collection matches that search.</p>';
    return;
  }
  $collectionNav.innerHTML = matches.map(({ collection, index, entries }) => `
    <button class="collection-nav-button${index === selectedCollection ? ' active' : ''}" type="button" data-collection-index="${index}" aria-pressed="${index === selectedCollection}" data-accent="${collectionAccent(index)}">
      <span class="collection-nav-icon" aria-hidden="true">${String(index + 1).padStart(2, '0')}</span>
      <span class="collection-nav-name">${esc(collection.name)}</span>
      <span class="collection-count">${entries.length}</span>
    </button>
  `).join('');
  paintAccents($collectionNav);
}

function renderFeatured() {
  const collection = collections[selectedCollection];
  const entries = entriesFor(collection);
  const accent = collectionAccent(selectedCollection);
  $featured.style.setProperty('--accent-fill', accent);
  $featured.setAttribute('aria-busy', 'false');
  $featured.innerHTML = `
    <div class="featured-head">
      <div class="featured-index" aria-hidden="true">${String(selectedCollection + 1).padStart(2, '0')}</div>
      <div class="featured-copy">
        <div class="featured-title-row">
          <h2 id="featuredTitle" tabindex="-1">${esc(collection.name)}</h2>
          <span class="badge">${entries.length} site${entries.length === 1 ? '' : 's'}</span>
        </div>
        <p>${esc(collection.description)}</p>
      </div>
    </div>
    <div class="featured-sites">
      ${entries.map(site => `
        <a class="featured-site" href="${esc(site.url)}" target="_blank" rel="nofollow ugc noopener noreferrer">
          ${siteIcon(site)}
          <span>
            <span class="site-name">${esc(site.name)}</span>
            <span class="site-context">${esc(site.description)}</span>
          </span>
          <span>
            <span class="site-domain">${esc(domainFor(site.url))}</span>
            <span class="site-open">Open</span>
          </span>
        </a>
      `).join('') || '<p class="lede">Every entry in this collection has left the directory.</p>'}
    </div>
  `;
}

function renderMoreCollections() {
  const items = collections
    .map((collection, index) => ({ collection, index, entries: entriesFor(collection) }))
    .filter(item => item.index !== selectedCollection);
  document.getElementById('moreHeading').hidden = items.length === 0;
  $moreCollections.innerHTML = items.map(({ collection, index, entries }) => `
    <button class="collection-summary" type="button" data-collection-index="${index}" data-accent="${collectionAccent(index)}" aria-label="View ${esc(collection.name)}">
      <span class="summary-title">
        <span class="summary-marker" aria-hidden="true">${String(index + 1).padStart(2, '0')}</span>
        <strong>${esc(collection.name)}</strong>
        <span class="badge">${entries.length} site${entries.length === 1 ? '' : 's'}</span>
      </span>
      <span class="summary-description">${esc(collection.description)}</span>
      <span class="summary-sites" role="list">
        ${entries.slice(0, 6).map(site => `<span role="listitem">${esc(site.name)}</span>`).join('')}
      </span>
      <span class="summary-action">Open collection</span>
    </button>
  `).join('');
  paintAccents($moreCollections);
}

function selectCollection(index, moveFocus) {
  if (!Number.isInteger(index) || index < 0 || index >= collections.length) return;
  selectedCollection = index;
  renderNavigation($collectionSearch.value);
  renderFeatured();
  renderMoreCollections();
  if (moveFocus) document.getElementById('featuredTitle')?.focus({ preventScroll: true });
}

function showError(message) {
  $featured.setAttribute('aria-busy', 'false');
  $featured.className = 'error';
  $featured.innerHTML = `<strong>Collections could not be loaded.</strong><p class="lede flush-top">${esc(message)}</p><button type="button" id="retry">Try again</button>`;
  $moreCollections.innerHTML = '';
  $collectionNav.innerHTML = '';
  document.getElementById('retry').addEventListener('click', event => {
    event.currentTarget.disabled = true;
    event.currentTarget.textContent = 'Retrying...';
    render();
  });
}

function render() {
  // Without this a second click starts a second fetch, and a late failure can
  // overwrite the render that already succeeded.
  if (loading) return;
  loading = true;
  $featured.className = 'featured';
  $featured.setAttribute('aria-busy', 'true');
  $featured.innerHTML = '<div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>';
  Promise.all([loadJson('./collections.json'), loadJson('./sites.json'), loadJson('./categories.json'), loadJson('./favicons.json')])
    .then(([loadedCollections, loadedSites, categories, loadedFavicons]) => {
      collections = loadedCollections;
      sites = loadedSites;
      favicons = loadedFavicons || {};
      sitesByUrl = new Map(sites.map(site => [site.url, site]));
      document.getElementById('collectionSiteCount').textContent = sites.length;
      document.getElementById('collectionCategoryCount').textContent = categories.length;
      $featured.setAttribute('aria-busy', 'false');
      if (!Array.isArray(collections) || !collections.length) {
        $featured.innerHTML = '<p class="lede">No collections have been published yet.</p>';
        return;
      }
      selectedCollection = 0;
      renderNavigation();
      renderFeatured();
      renderMoreCollections();
    })
    .catch(error => showError(navigator.onLine === false
      ? 'You appear to be offline and nothing is cached yet.'
      : error.message))
    .finally(() => { loading = false; });
}

$collectionSearch.addEventListener('input', event => renderNavigation(event.target.value));
$collectionNav.addEventListener('click', event => {
  const button = event.target.closest('[data-collection-index]');
  if (button) selectCollection(Number(button.dataset.collectionIndex), true);
});
$moreCollections.addEventListener('click', event => {
  const button = event.target.closest('[data-collection-index]');
  if (button) {
    selectCollection(Number(button.dataset.collectionIndex), true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

render();
</script>
</body>
</html>
